<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || 'pt-BR';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
  // Boot watchdog. A chunk this browser cannot parse (1.4.2's regex lookbehind on iOS 15.5 to
  // 16.3) kills the module graph before any of the app runs, and the logo lifted forever. Here,
  // outside the bundle and in plain old syntax, so it still runs then: a script that fails to
  // load or parse, or no app after 10 s, puts the reason and a Reload button where the logo was.
  // English only, as the packs are in the bundle that did not load. lib/boot.js removes #boot
  // (message included) once the app draws, so a slow start that gets there still gets there.
  (function () {
    var shown = false, last = '';
    function fail(title, detail) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { fail(title, detail); });
      if (shown || !b || b.getAttribute('data-leaving')) return;
      shown = true;
      b.className = 'fail';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', 'alert');
      b.setAttribute('dir', 'ltr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = 'Reloading often helps. If it keeps happening, please send us this:';
      var c = document.createElement('code');
      c.textContent = (detail || 'No error, it just never finished loading.') + ' (' + navigator.userAgent + ')';
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Reload';
      r.onclick = function () { location.reload(); };
      box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(r);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return fail('DAYON - Treino could not start on this browser.', 'Could not load ' + (t.src || 'a script'));
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) fail('DAYON - Treino could not start on this browser.', last);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      fail(last ? 'DAYON - Treino could not start on this browser.' : 'DAYON - Treino is taking too long to start.', last);
    }, 10000);
  })();
</script>
<title>DAYON - Treino</title>
<meta name="description" content="DAYON - Treino: seu diário de treino e peso corporal">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DAYON">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs, so the gap between the
     native splash and the first real screen shows the DAY ON wordmark on white, the same as the
     native splash (resources/dayon/compor-marca.swift). lib/boot.js takes it away the moment the
     app can draw, so it never adds a wait. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#fff;transition:opacity .22s ease-out}
  #boot.out{opacity:0;pointer-events:none}
  #boot .dl{display:inline-flex;align-items:center;gap:.1em;font-size:46px;line-height:1;animation:boot-in .3s cubic-bezier(.3,.7,.4,1) both}
  #boot .dl-day{font-family:"Times New Roman",Times,Charter,Georgia,serif;font-style:italic;font-weight:700;letter-spacing:-.02em;color:#121214}
  #boot .dl-on{display:inline-flex;align-items:center;gap:.02em;height:.86em;padding:0 .3em 0 .22em;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,#a8ef3d 0%,#5fcf2e 55%,#30a323 100%);box-shadow:0 .08em .2em -.06em rgba(30,90,10,.45);animation:boot-pulse 1.25s ease-in-out .5s infinite}
  #boot .dl-on svg{width:.6em;height:.6em}
  #boot .dl-on span{font-family:"Times New Roman",Times,Charter,Georgia,serif;font-style:italic;font-weight:700;font-size:.74em}
  @keyframes boot-in{from{transform:translateY(8px);opacity:0}}
  @keyframes boot-pulse{50%{transform:scale(1.06)}}
  #boot.fail{place-items:center;padding:24px}
  #boot.fail div{max-width:340px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#141414;text-align:center}
  #boot.fail .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:10px;background:#f2f3f1;color:#4a4f45;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button{font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#a8ef3d,#30a323);border:0;border-radius:999px;min-height:44px;padding:0 28px}
  @media (prefers-reduced-motion:reduce){ #boot .dl,#boot .dl-on{animation:none} }
</style>
<div id="boot" aria-hidden="true">
  <div class="dl"><span class="dl-day">DAY</span><span class="dl-on"><svg viewBox="0 0 24 24"><path d="M7.4 6.2a8 8 0 1 0 9.2 0" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M12 2.6v8.2" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg><span>N</span></span></div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
